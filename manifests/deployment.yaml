apiVersion: apps/v1
kind: Deployment
metadata:
  name: wf-aks-sample-deploy
  labels:
    app.kubernetes.io/name: wf-aks-sample-deploy
    kubernetes.azure.com/generator: devhub
  namespace: sample-app-namespace-1787113322033
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wf-aks-sample-deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wf-aks-sample-deploy
    spec:
      containers:
        - name: wf-aks-sample-deploy
          image: registry1787113376115.azurecr.io/image-workflow-1787113322026:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "0.5"
              memory: "0.5Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: wf-aks-sample-deploy-config
            - secretRef:
                name: secret-ref
                optional: true
          livenessProbe:
            tcpSocket:
              port: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 1
            successThreshold: 1
            initialDelaySeconds: 3
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
            initialDelaySeconds: 0
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: wf-aks-sample-deploy
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wf-aks-sample-deploy
